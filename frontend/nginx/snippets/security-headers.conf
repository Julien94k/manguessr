# En-tetes de securite des pages. Inclus dans chaque location qui sert du HTML ou des assets :
# un add_header dans une location annule l'heritage de ceux du bloc server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Vide en acces direct (reseau local, HTTP) : nginx n'emet pas un en-tete de valeur vide.
add_header Strict-Transport-Security $hsts always;
# img-src https: : la jaquette nette de la solution vient du CDN AniList. Tout le reste (scripts,
# audio, video, API) est servi par ce domaine. unsafe-inline limite aux styles (attributs style).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
