# Adresse reelle du visiteur. Derriere le tunnel, cloudflared se connecte depuis la machine :
# $remote_addr serait le meme pour tout le monde. Cloudflare transmet l'adresse du visiteur
# dans CF-Connecting-IP et ecrase toute valeur envoyee par le client. En acces direct sur le
# reseau local, l'en-tete est absent et l'adresse TCP fait foi.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Protocole du visiteur cote Cloudflare : CF-Visitor vaut {"scheme":"https"} ou {"scheme":"http"}.
# Vide en acces direct (reseau local) : surtout pas $scheme par defaut, qui vaut toujours « http »
# ici et declencherait la redirection HTTPS sur l'acces local.
map $http_cf_visitor $visitor_scheme {
    ~*"scheme":"https"  https;
    ~*"scheme":"http"   http;
    default             "";
}

# Protocole transmis au backend : celui du visiteur derriere le tunnel, sinon celui de nginx.
map $visitor_scheme $forwarded_proto {
    ""      $scheme;
    default $visitor_scheme;
}

map $visitor_scheme $hsts {
    https   "max-age=31536000";
    default "";
}

# Limites de debit par visiteur (reponse 429 au-dela).
# Connexion et inscription : force brute et creation de comptes en masse.
limit_req_zone $client_ip zone=auth:10m rate=10r/m;
# Creation de parties : chaque partie ecrit en base et fait travailler le Pi (rendu d'images).
limit_req_zone $client_ip zone=sessions:10m rate=30r/m;
# Reste de l'API : large, les images d'une manche partent en rafale.
limit_req_zone $client_ip zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    limit_req_status 429;

    # Visiteur arrive en HTTP clair par le tunnel : redirection, sinon mot de passe et jeton
    # transiteraient en clair jusqu'a Cloudflare. L'acces direct au Pi n'a pas CF-Visitor.
    if ($visitor_scheme = "http") {
        return 301 https://$host$request_uri;
    }

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Fichiers de build : leur nom porte une empreinte du contenu, ils sont immuables.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Un seul en-tete : « expires » en emettrait un second, contradictoire avec celui-ci.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA : toute route inconnue renvoie index.html. Jamais mis en cache, sinon un navigateur
    # garderait la reference aux assets d'un ancien build.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /api/auth/login {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location = /api/auth/register {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location = /api/sessions {
        limit_req zone=sessions burst=10 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
        # Le premier rendu d'une image (telechargement + flou) peut etre lent sur un Pi.
        proxy_read_timeout 120s;
    }

    # Generiques relayes en flux. Sans desactiver le tampon, nginx accumulerait le fichier
    # avant de le transmettre : plusieurs secondes de silence avant le premier son.
    location /api/media/stream/ {
        include /etc/nginx/snippets/proxy-backend.conf;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
}
